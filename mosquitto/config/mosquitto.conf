# MQTT over TCP for the firmware + logger
listener 1883
protocol mqtt

# MQTT over WebSockets for the browser dashboard
listener 9001
protocol websockets

# Anonymous LAN-only deployment. Add password_file later if exposing
# beyond the home network.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 30

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
