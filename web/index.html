<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14100c">
<title>Espresso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,100..900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
<style>
  :root {
    --bg-0: #14100c;
    --bg-1: #1c1612;
    --bg-2: #241c16;
    --line: #2e2520;
    --line-bright: #44372d;
    --fg: #f4ead9;
    --fg-2: #c8b9a1;
    --dim: #7a6a58;
    --copper: #d4915c;
    --copper-bright: #ecaa72;
    --cream: #f0d9a8;
    --good: #8fbc7a;
    --bad: #d4715c;
    --warn: #e8b260;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg-0); }
  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    color: var(--fg); font-weight: 400;
    display: grid; grid-template-rows: auto 1fr;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, #2a1c12 0%, transparent 70%),
      var(--bg-0);
  }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 18px;
    padding: 14px 24px; border-bottom: 1px solid var(--line);
    background: rgba(20, 16, 12, 0.7); backdrop-filter: blur(8px);
  }
  .logo {
    font-family: 'Fraunces', serif; font-weight: 400; font-size: 18px;
    letter-spacing: 0.02em; font-style: italic;
    color: var(--copper-bright);
  }
  .tabs { display: flex; gap: 2px; }
  .tab {
    background: none; border: none; color: var(--dim);
    font: 500 12px/1 'Inter', sans-serif;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 6px 12px; cursor: pointer; border-radius: 4px;
    transition: color 0.15s, background 0.15s;
  }
  .tab:hover { color: var(--fg-2); }
  .tab.active { color: var(--copper-bright); background: rgba(212, 145, 92, 0.08); }

  .badge {
    font: 500 10px/1 'Inter', sans-serif;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--line-bright); color: var(--dim);
    transition: all 0.25s ease;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .badge::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; opacity: 0.7;
  }
  .badge.idle { color: var(--dim); }
  .badge.extracting {
    color: var(--copper-bright); border-color: var(--copper);
    background: rgba(212, 145, 92, 0.08);
  }
  .badge.extracting::before { animation: pulse 1.2s ease-in-out infinite; }
  .badge.done { color: var(--good); border-color: var(--good); background: rgba(143, 188, 122, 0.08); }
  .badge.replay { color: var(--warn); border-color: var(--warn); background: rgba(232, 178, 96, 0.08); }
  .badge.offline { color: var(--bad); border-color: var(--bad); background: rgba(212, 113, 92, 0.08); }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  #status { margin-left: auto; font-size: 11px; color: var(--dim); letter-spacing: 0.04em; }
  #status.connected { color: var(--good); }
  #status.error { color: var(--bad); }

  /* ---------- main canvas ---------- */
  main { position: relative; min-height: 0; overflow: hidden; }
  #stage { position: relative; width: 100%; height: 100%; padding: 28px 36px; }

  /* hero readout — big number floating top-left */
  #hero {
    position: absolute; top: 28px; left: 36px; z-index: 5;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  #weight {
    font-family: 'Fraunces', serif;
    font-variation-settings: "opsz" 144, "SOFT" 30;
    font-weight: 200; font-size: 144px; line-height: 0.85;
    color: var(--cream); letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 60px rgba(212, 145, 92, 0.18);
    display: flex; align-items: baseline; gap: 8px;
  }
  #weight .v { display: inline-block; }
  #weight .unit {
    font-size: 32px; color: var(--dim); font-weight: 300;
    font-style: italic; letter-spacing: 0;
  }
  #subhero {
    margin-top: 10px;
    display: flex; align-items: baseline; gap: 18px;
    color: var(--fg-2); font-size: 13px;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  #subhero .label { color: var(--dim); margin-right: 6px; }
  #elapsed-v, #flow-v { font-variant-numeric: tabular-nums; color: var(--copper-bright); font-weight: 500; }

  /* tank widget — sits in the header */
  #tank-widget {
    font-size: 11px; color: var(--fg-2); letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 5px 10px; border: 1px solid var(--line-bright); border-radius: 999px;
    display: inline-flex; align-items: baseline; gap: 6px;
  }
  #tank-widget .label { color: var(--dim); }
  #tank-widget .v { color: var(--copper-bright); font-variant-numeric: tabular-nums; font-weight: 500; }
  #tank-widget .v::after { content: '%'; color: var(--dim); margin-left: 1px; }

  /* chart */
  #chart-wrap {
    position: absolute; left: 0; right: 0; bottom: 0; top: 0;
    pointer-events: none;
  }
  #chart {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    pointer-events: auto;
    cursor: crosshair;
  }

  /* hover tooltip */
  #tooltip {
    position: absolute; pointer-events: none; z-index: 20;
    padding: 10px 14px; min-width: 130px;
    background: rgba(28, 22, 18, 0.92); backdrop-filter: blur(8px);
    border: 1px solid var(--line-bright); border-radius: 6px;
    font-size: 12px; color: var(--fg-2);
    opacity: 0; transition: opacity 0.12s;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  #tooltip.visible { opacity: 1; }
  #tooltip .row { display: flex; justify-content: space-between; gap: 14px; line-height: 1.6; }
  #tooltip .k { color: var(--dim); letter-spacing: 0.06em; text-transform: uppercase; font-size: 10px; }
  #tooltip .v { font-variant-numeric: tabular-nums; font-weight: 500; }
  #tooltip .v.weight { color: var(--copper-bright); }
  #tooltip .v.flow { color: var(--cream); }
  #tooltip .v.t { color: var(--fg); }

  #subhero #stat-pre, #subhero #stat-peak {
    opacity: 0; transform: translateY(-4px);
    transition: opacity 0.3s 0.05s, transform 0.3s 0.05s;
  }
  #subhero #stat-pre.visible, #subhero #stat-peak.visible {
    opacity: 1; transform: translateY(0);
  }

  /* ---------- history panel ---------- */
  #history {
    position: fixed; right: 0; top: 53px; bottom: 0; width: 340px;
    border-left: 1px solid var(--line-bright);
    background: linear-gradient(180deg, var(--bg-1), var(--bg-0));
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.25s cubic-bezier(0.3, 0.9, 0.4, 1.0);
    z-index: 30;
    box-shadow: -16px 0 48px rgba(0,0,0,0.5);
  }
  main.history-open #history { transform: translateX(0); }
  #history-header {
    padding: 14px 18px; font-size: 10px; color: var(--dim);
    text-transform: uppercase; letter-spacing: 0.14em;
    border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; background: var(--bg-1); z-index: 1;
  }
  #history-header .actions { display: flex; gap: 8px; align-items: center; }
  #history-header button {
    background: none; border: 1px solid var(--line-bright); color: var(--fg-2);
    font: 500 10px/1 'Inter', sans-serif; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 5px 10px; border-radius: 3px; cursor: pointer;
    transition: all 0.15s;
  }
  #history-header button:hover { color: var(--copper-bright); border-color: var(--copper); }
  #close-history {
    font-size: 18px !important; padding: 2px 9px !important;
    letter-spacing: 0 !important; line-height: 1 !important;
  }

  .row {
    padding: 14px 18px; border-bottom: 1px solid var(--line); cursor: pointer;
    transition: background 0.12s;
    display: grid; gap: 4px;
  }
  .row:hover { background: rgba(212, 145, 92, 0.05); }
  .row.selected {
    background: rgba(212, 145, 92, 0.08);
    border-left: 2px solid var(--copper);
    padding-left: 16px;
  }
  .row .when {
    font-size: 10px; color: var(--dim); letter-spacing: 0.06em; text-transform: uppercase;
  }
  .row .top {
    display: flex; justify-content: space-between; align-items: baseline; margin-top: 2px;
  }
  .row .weight-val {
    font-family: 'Fraunces', serif; font-weight: 300; font-size: 22px;
    color: var(--cream); font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  }
  .row .weight-val .u { font-size: 11px; color: var(--dim); font-style: italic; margin-left: 1px; }
  .row .duration { font-size: 11px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
  .row .meta { font-size: 10px; color: var(--dim); letter-spacing: 0.04em; }
  #history-empty { padding: 40px 18px; color: var(--dim); font-size: 12px; text-align: center; font-style: italic; }

  /* ---------- mobile / tablet ---------- */
  @media (max-width: 900px) {
    #stage { padding: 18px 22px; }
    #hero { top: 18px; left: 22px; right: 22px; }
    #weight { font-size: 96px; }
    #weight .unit { font-size: 22px; }
    #subhero { font-size: 12px; gap: 14px; flex-wrap: wrap; }
  }
  @media (max-width: 600px) {
    header {
      padding: 10px 14px; gap: 8px; flex-wrap: wrap;
      row-gap: 8px;
    }
    .logo { font-size: 15px; }
    .tab { padding: 4px 8px; font-size: 11px; }
    .badge { padding: 4px 8px; font-size: 9px; }
    #tank-widget { padding: 4px 8px; font-size: 10px; }
    #status { font-size: 10px; flex-basis: 100%; text-align: right; }

    #stage { padding: 14px 16px; }
    #hero { top: 14px; left: 16px; right: 16px; }
    #weight { font-size: 72px; }
    #weight .unit { font-size: 18px; }
    #subhero {
      margin-top: 6px; font-size: 11px; gap: 8px 14px;
      letter-spacing: 0.04em;
    }
    #subhero .label { margin-right: 4px; }

    #history { width: 100vw; }
    #tooltip { font-size: 11px; padding: 8px 11px; min-width: 110px; }
  }
  @media (max-width: 400px) {
    #weight { font-size: 60px; }
    #weight .unit { font-size: 16px; }
  }
</style>
</head>
<body>

<header>
  <span class="logo">Espresso</span>
  <div class="tabs">
    <button class="tab active" data-mode="live">Live</button>
    <button class="tab" data-mode="history">History</button>
  </div>
  <span class="badge idle" id="state-badge">Idle</span>
  <span class="badge offline" id="device-badge" style="display:none">Device offline</span>
  <span id="tank-widget"><span class="label">tank</span> <span class="v" id="tank-v">—</span></span>
  <span id="status">connecting</span>
</header>

<main id="main">
  <div id="stage">
    <div id="hero">
      <div id="weight"><span class="v">—</span><span class="unit">g</span></div>
      <div id="subhero">
        <div><span class="label">elapsed</span><span id="elapsed-v">0.0s</span></div>
        <div><span class="label">flow</span><span id="flow-v">0.00 g/s</span></div>
        <div id="stat-pre"><span class="label">preinfusion</span><span id="pre-v">—s</span></div>
        <div id="stat-peak"><span class="label">peak</span><span id="peak-v">— g/s</span></div>
      </div>
    </div>

    <div id="chart-wrap">
      <svg id="chart" preserveAspectRatio="none">
        <defs>
          <linearGradient id="weight-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#d4915c" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#d4915c" stop-opacity="0"/>
          </linearGradient>
          <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2.5" result="b1"/>
            <feGaussianBlur stdDeviation="6" result="b2"/>
            <feMerge>
              <feMergeNode in="b2"/>
              <feMergeNode in="b1"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <pattern id="grid" width="60" height="40" patternUnits="userSpaceOnUse">
            <path d="M 60 0 L 0 0 0 40" fill="none" stroke="#241c16" stroke-width="1"/>
          </pattern>
        </defs>
        <rect class="grid-bg" width="100%" height="100%" fill="url(#grid)" opacity="0.5"/>
        <rect class="preinfusion-band" fill="rgba(212, 145, 92, 0.06)" stroke="rgba(212, 145, 92, 0.18)" stroke-dasharray="2 4" stroke-width="1" x="0" y="0" width="0" height="100%"/>
        <line class="first-drop" stroke="var(--copper)" stroke-width="1" stroke-dasharray="3 3" opacity="0" x1="0" x2="0" y1="0" y2="100%"/>
        <path class="weight-fill" fill="url(#weight-grad)" d=""/>
        <path class="flow-curve" fill="none" stroke="var(--cream)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.55" d=""/>
        <path class="weight-curve" fill="none" stroke="var(--copper-bright)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)" d=""/>
        <line class="cursor" stroke="var(--fg-2)" stroke-width="1" stroke-dasharray="2 3" opacity="0" x1="0" x2="0" y1="0" y2="100%"/>
        <circle class="cursor-dot weight" r="4" fill="var(--copper-bright)" opacity="0" filter="url(#glow)"/>
        <circle class="cursor-dot flow" r="3" fill="var(--cream)" opacity="0"/>
      </svg>
      <div id="tooltip">
        <div class="row"><span class="k">t</span><span class="v t" id="tt-t">—</span></div>
        <div class="row"><span class="k">weight</span><span class="v weight" id="tt-w">—</span></div>
        <div class="row"><span class="k">flow</span><span class="v flow" id="tt-f">—</span></div>
      </div>
    </div>

  </div>

  <aside id="history">
    <div id="history-header">
      <span>Recent shots</span>
      <div class="actions">
        <button id="back-to-live" title="Resume live updates">Live</button>
        <button id="close-history" title="Hide panel" aria-label="Close">×</button>
      </div>
    </div>
    <div id="history-list"></div>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
const statusEl = $('status');
const stateBadge = $('state-badge');
const deviceBadge = $('device-badge');
const tankV = $('tank-v');
const weightV = document.querySelector('#weight .v');
const elapsedV = $('elapsed-v');
const flowV = $('flow-v');
const mainEl = $('main');
const historyList = $('history-list');
const heroEl = $('hero');
const tooltip = $('tooltip');
const statPre = $('stat-pre');
const statPeak = $('stat-peak');
const preV = $('pre-v');
const peakV = $('peak-v');

let mode = 'live';
let activeShotId = null;
let selectedFile = null;

// ---------- weight tween ----------
let displayedWeight = 0;
let targetWeight = 0;
let tweenRaf = null;
function setWeight(w) {
  if (!Number.isFinite(w)) { weightV.textContent = '—'; return; }
  targetWeight = w;
  if (!tweenRaf) tween();
}
function tween() {
  const d = targetWeight - displayedWeight;
  displayedWeight += d * 0.28;
  if (Math.abs(d) < 0.02 || !Number.isFinite(displayedWeight)) {
    displayedWeight = Number.isFinite(targetWeight) ? targetWeight : 0;
    tweenRaf = null;
  } else {
    tweenRaf = requestAnimationFrame(tween);
  }
  weightV.textContent = displayedWeight.toFixed(1);
}

// ---------- chart ----------
class ShotChart {
  constructor(svg) {
    this.svg = svg;
    this.samples = [];
    this.meta = {};
    this.pad = { l: 30, r: 30, t: 30, b: 30 };
    this.fixedMaxT = 32;   // seconds — chart shows 0..max(this, dataMax)
    this.fixedMaxW = 50;   // grams
    this.fixedMaxF = 3.5;  // g/s

    this.bg = svg.querySelector('.grid-bg');
    this.preBand = svg.querySelector('.preinfusion-band');
    this.firstDrop = svg.querySelector('.first-drop');
    this.weightFill = svg.querySelector('.weight-fill');
    this.weightCurve = svg.querySelector('.weight-curve');
    this.flowCurve = svg.querySelector('.flow-curve');
    this.cursorLine = svg.querySelector('.cursor');
    this.cursorDotW = svg.querySelector('.cursor-dot.weight');
    this.cursorDotF = svg.querySelector('.cursor-dot.flow');

    this.resize();
    new ResizeObserver(() => { this.resize(); this.render(); }).observe(svg);
    svg.addEventListener('mousemove', (e) => this.onHover(e));
    svg.addEventListener('mouseleave', () => this.hideTooltip());
    // Touch: tap or drag along the chart to scrub the tooltip
    const onTouch = (e) => {
      if (!e.touches.length) return;
      e.preventDefault();
      const t = e.touches[0];
      this.onHover({ clientX: t.clientX, clientY: t.clientY });
    };
    svg.addEventListener('touchstart', onTouch, { passive: false });
    svg.addEventListener('touchmove', onTouch, { passive: false });
    svg.addEventListener('touchend', () => setTimeout(() => this.hideTooltip(), 1500));
  }

  resize() {
    const r = this.svg.getBoundingClientRect();
    this.W = r.width;
    this.H = r.height;
    this.svg.setAttribute('viewBox', `0 0 ${this.W} ${this.H}`);
  }

  // Data → SVG pixel coords
  xScale(t) {
    const maxT = Math.max(this.fixedMaxT, this.samples.length ? this.samples.at(-1).t : 0);
    return this.pad.l + (t / maxT) * (this.W - this.pad.l - this.pad.r);
  }
  yScaleW(w) {
    const maxW = Math.max(this.fixedMaxW, ...this.samples.map(s => s.w || 0));
    return this.H - this.pad.b - (w / maxW) * (this.H - this.pad.t - this.pad.b);
  }
  yScaleF(f) {
    const maxF = Math.max(this.fixedMaxF, ...this.samples.map(s => s.f || 0));
    return this.H - this.pad.b - (f / maxF) * (this.H - this.pad.t - this.pad.b);
  }

  setShot(samples, meta) {
    this.samples = (samples || []).filter(s => Number.isFinite(s.t) && Number.isFinite(s.w));
    this.meta = meta || {};
    this.render();
  }
  appendSample(s) {
    if (!Number.isFinite(s.t) || !Number.isFinite(s.w)) return;
    this.samples.push(s);
    this.render();
  }
  setMeta(meta) { Object.assign(this.meta, meta); this.render(); }
  reset() { this.samples = []; this.meta = {}; this.render(); }

  render() {
    if (!this.samples.length) {
      this.weightCurve.setAttribute('d', '');
      this.flowCurve.setAttribute('d', '');
      this.weightFill.setAttribute('d', '');
      this.preBand.setAttribute('width', 0);
      this.firstDrop.setAttribute('opacity', 0);
      return;
    }

    // weight curve
    let dW = '', dF = '';
    this.samples.forEach((s, i) => {
      const x = this.xScale(s.t);
      const yw = this.yScaleW(s.w);
      const yf = this.yScaleF(s.f ?? 0);
      dW += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + yw.toFixed(1) + ' ';
      dF += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + yf.toFixed(1) + ' ';
    });
    this.weightCurve.setAttribute('d', dW);
    this.flowCurve.setAttribute('d', dF);

    // weight fill (close to baseline)
    const x0 = this.xScale(this.samples[0].t);
    const xN = this.xScale(this.samples.at(-1).t);
    const yBase = this.H - this.pad.b;
    this.weightFill.setAttribute('d', `M${x0} ${yBase} ` + dW.slice(1) + `L${xN} ${yBase} Z`);

    // preinfusion band: 0 to first_drop_at_ms (or preinfusion_s)
    const preEnd = this.meta.first_drop_at_ms != null
      ? this.meta.first_drop_at_ms / 1000
      : (this.meta.preinfusion_s ?? null);
    if (preEnd && preEnd > 0) {
      const px0 = this.xScale(0);
      const px1 = this.xScale(preEnd);
      this.preBand.setAttribute('x', px0);
      this.preBand.setAttribute('width', Math.max(0, px1 - px0));
      this.preBand.setAttribute('y', this.pad.t);
      this.preBand.setAttribute('height', this.H - this.pad.t - this.pad.b);
      this.firstDrop.setAttribute('x1', px1);
      this.firstDrop.setAttribute('x2', px1);
      this.firstDrop.setAttribute('y1', this.pad.t);
      this.firstDrop.setAttribute('y2', this.H - this.pad.b);
      this.firstDrop.setAttribute('opacity', 0.55);
    } else {
      this.preBand.setAttribute('width', 0);
      this.firstDrop.setAttribute('opacity', 0);
    }
  }

  onHover(e) {
    if (!this.samples.length) return;
    const r = this.svg.getBoundingClientRect();
    const px = e.clientX - r.left;
    const dataX = this.invertX(px);
    // find nearest sample
    let nearest = this.samples[0], best = Infinity;
    for (const s of this.samples) {
      const d = Math.abs(s.t - dataX);
      if (d < best) { best = d; nearest = s; }
    }
    const sx = this.xScale(nearest.t);
    const sy = this.yScaleW(nearest.w);
    const sf = this.yScaleF(nearest.f ?? 0);

    this.cursorLine.setAttribute('x1', sx);
    this.cursorLine.setAttribute('x2', sx);
    this.cursorLine.setAttribute('y1', this.pad.t);
    this.cursorLine.setAttribute('y2', this.H - this.pad.b);
    this.cursorLine.setAttribute('opacity', 0.55);

    this.cursorDotW.setAttribute('cx', sx);
    this.cursorDotW.setAttribute('cy', sy);
    this.cursorDotW.setAttribute('opacity', 1);
    this.cursorDotF.setAttribute('cx', sx);
    this.cursorDotF.setAttribute('cy', sf);
    this.cursorDotF.setAttribute('opacity', 1);

    $('tt-t').textContent = nearest.t.toFixed(1) + ' s';
    $('tt-w').textContent = (nearest.w ?? 0).toFixed(1) + ' g';
    $('tt-f').textContent = (nearest.f ?? 0).toFixed(2) + ' g/s';
    tooltip.classList.add('visible');
    // position near cursor, but flip if near right edge
    const tw = tooltip.offsetWidth || 160;
    const wrapR = $('chart-wrap').getBoundingClientRect();
    const left = (e.clientX - wrapR.left) + 14;
    const right = wrapR.width - left - tw;
    tooltip.style.left = (right < 0 ? (e.clientX - wrapR.left - tw - 14) : left) + 'px';
    tooltip.style.top = Math.max(8, e.clientY - wrapR.top - 60) + 'px';
  }

  invertX(px) {
    const maxT = Math.max(this.fixedMaxT, this.samples.length ? this.samples.at(-1).t : 0);
    return ((px - this.pad.l) / (this.W - this.pad.l - this.pad.r)) * maxT;
  }

  hideTooltip() {
    tooltip.classList.remove('visible');
    this.cursorLine.setAttribute('opacity', 0);
    this.cursorDotW.setAttribute('opacity', 0);
    this.cursorDotF.setAttribute('opacity', 0);
  }
}

const chart = new ShotChart($('chart'));

// ---------- badge ----------
function setBadge(text, cls) {
  stateBadge.textContent = text;
  stateBadge.className = `badge ${cls}`;
}

// ---------- shot-end stats (inline in subhero) ----------
function showStats(p) {
  preV.textContent = (p.preinfusion_s != null ? p.preinfusion_s.toFixed(1) : '—') + 's';
  peakV.textContent = (p.peak_flow_g_s != null ? p.peak_flow_g_s.toFixed(2) : '—') + ' g/s';
  statPre.classList.add('visible');
  statPeak.classList.add('visible');
}
function hideStats() {
  statPre.classList.remove('visible');
  statPeak.classList.remove('visible');
}

// ---------- subhero values ----------
function setElapsed(s) { elapsedV.textContent = (Number.isFinite(s) ? s : 0).toFixed(1) + 's'; }
function setFlow(f) { flowV.textContent = (Number.isFinite(f) ? f : 0).toFixed(2) + ' g/s'; }

// ---------- MQTT ----------
const wsUrl = `ws://${window.location.hostname}:9001`;
const client = mqtt.connect(wsUrl, {
  clientId: 'web-' + Math.random().toString(16).slice(2, 10),
  reconnectPeriod: 2000,
});
client.on('connect', () => {
  statusEl.textContent = 'connected';
  statusEl.className = 'connected';
  client.subscribe([
    'coffee/shot/start', 'coffee/shot/sample', 'coffee/shot/end',
    'coffee/water/pct', 'coffee/device/state',
  ]);
});
client.on('error', (err) => { statusEl.textContent = `error: ${err.message}`; statusEl.className = 'error'; });
client.on('reconnect', () => { statusEl.textContent = 'reconnecting'; statusEl.className = ''; });

client.on('message', (topic, msg) => {
  const text = msg.toString();
  let p; try { p = JSON.parse(text); } catch { p = text; }

  if (topic === 'coffee/water/pct') {
    const n = parseFloat(text);
    tankV.textContent = Number.isFinite(n) ? Math.round(n) : '—';
    return;
  }
  if (topic === 'coffee/device/state') {
    deviceBadge.style.display = (text === 'online') ? 'none' : '';
    return;
  }
  if (mode === 'replay') return;

  if (topic === 'coffee/shot/start') {
    activeShotId = p.shot_id;
    chart.reset();
    hideStats();
    setBadge('Extracting', 'extracting');
    displayedWeight = 0; setWeight(0);
    setElapsed(0); setFlow(0);
    if (p.tank_pct_at_start != null) tankV.textContent = Math.round(p.tank_pct_at_start);
  } else if (topic === 'coffee/shot/sample') {
    if (activeShotId == null) {
      activeShotId = p.shot_id;
      setBadge('Extracting', 'extracting');
    }
    const t = (p.t_ms ?? 0) / 1000;
    chart.appendSample({ t, w: p.weight_g, f: p.flow_g_s });
    setWeight(p.weight_g ?? 0);
    setElapsed(t);
    setFlow(p.flow_g_s);
  } else if (topic === 'coffee/shot/end') {
    activeShotId = null;
    setBadge('Done', 'done');
    chart.setMeta({
      preinfusion_s: p.preinfusion_s,
      first_drop_at_ms: p.first_drop_at_ms,
    });
    if (p.final_weight_g != null) setWeight(p.final_weight_g);
    if (p.duration_s != null) setElapsed(p.duration_s);
    setFlow(p.peak_flow_g_s ?? 0);
    showStats(p);
    loadHistory();
  }
});

// ---------- history ----------
async function loadHistory() {
  try {
    const r = await fetch('/shots/index.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    renderHistory(await r.json());
  } catch (e) {
    historyList.innerHTML = `<div id="history-empty">No history (${e.message})</div>`;
  }
}
function renderHistory(items) {
  if (!items.length) {
    historyList.innerHTML = `<div id="history-empty">No shots saved yet</div>`;
    return;
  }
  historyList.innerHTML = items.map(it => {
    const when = it.saved_at || it.file;
    const dur = it.duration_s != null ? `${it.duration_s.toFixed(1)} s` : '—';
    const wt = it.final_weight_g != null ? `${it.final_weight_g.toFixed(1)}<span class="u">g</span>` : '—';
    const flow = it.peak_flow_g_s != null ? `${it.peak_flow_g_s.toFixed(2)} g/s peak` : '';
    const tank = it.tank_pct_at_start != null ? `tank ${Math.round(it.tank_pct_at_start)}%` : '';
    const meta = [flow, tank].filter(Boolean).join(' · ');
    const sel = it.file === selectedFile ? ' selected' : '';
    return `<div class="row${sel}" data-file="${it.file}">
      <div class="when">${when}</div>
      <div class="top"><div class="weight-val">${wt}</div><div class="duration">${dur}</div></div>
      <div class="meta">${meta}</div>
    </div>`;
  }).join('');
  historyList.querySelectorAll('.row').forEach(r => {
    r.addEventListener('click', () => replayShot(r.dataset.file));
  });
}

async function replayShot(file) {
  try {
    const r = await fetch(`/shots/${encodeURIComponent(file)}`, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const shot = await r.json();
    selectedFile = file;
    mode = 'replay';
    setBadge('Replay', 'replay');

    const samples = (shot.samples || []).map(s => ({ t: (s.t_ms ?? 0)/1000, w: s.weight_g, f: s.flow_g_s }));
    chart.setShot(samples, {
      preinfusion_s: shot.preinfusion_s,
      first_drop_at_ms: shot.first_drop_at_ms,
    });
    setWeight(shot.final_weight_g ?? 0);
    setElapsed(shot.duration_s ?? 0);
    setFlow(shot.peak_flow_g_s ?? 0);
    if (shot.tank_pct_at_start != null) tankV.textContent = Math.round(shot.tank_pct_at_start);
    showStats(shot);
    loadHistory();
  } catch (e) {
    statusEl.textContent = `replay failed: ${e.message}`;
    statusEl.className = 'error';
  }
}

function backToLive() {
  mode = 'live';
  selectedFile = null;
  activeShotId = null;
  chart.reset();
  setWeight(0); setElapsed(0); setFlow(0);
  weightV.textContent = '—';
  hideStats();
  setBadge('Idle', 'idle');
  loadHistory();
}

// ---------- tabs ----------
function setHistoryOpen(open) {
  mainEl.classList.toggle('history-open', open);
  document.querySelector('[data-mode="history"]').classList.toggle('active', open);
  if (open) loadHistory();
}
document.querySelector('[data-mode="live"]').addEventListener('click', () => {
  document.querySelector('[data-mode="live"]').classList.add('active');
  setHistoryOpen(false);
  if (mode === 'replay') backToLive();
});
document.querySelector('[data-mode="history"]').addEventListener('click', () => {
  setHistoryOpen(!mainEl.classList.contains('history-open'));
});
$('close-history').addEventListener('click', () => setHistoryOpen(false));
$('back-to-live').addEventListener('click', () => {
  setHistoryOpen(false);
  document.querySelector('[data-mode="live"]').classList.add('active');
  backToLive();
});

loadHistory();
</script>
