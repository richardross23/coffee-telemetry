<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Espresso shot — live</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --bg: #111;
    --panel: #1a1a1a;
    --border: #2a2a2a;
    --fg: #eee;
    --dim: #888;
    --accent: #6cf;
    --accent2: #fc6;
    --good: #6c6;
    --bad: #c66;
    --warn: #ec6;
  }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, system-ui, "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--fg);
    display: grid; grid-template-rows: auto 1fr;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  h1 { margin: 0; font-size: 16px; font-weight: 500; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    border: 1px solid var(--border); background: var(--panel); color: var(--dim);
    font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 4px; cursor: pointer;
  }
  .tab.active { color: var(--fg); border-color: var(--accent); }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    border: 1px solid var(--border); color: var(--dim);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .badge.idle { color: var(--dim); }
  .badge.extracting { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  .badge.done { color: var(--bg); background: var(--good); border-color: var(--good); }
  .badge.replay { color: var(--bg); background: var(--warn); border-color: var(--warn); }
  .badge.offline { color: var(--bg); background: var(--bad); border-color: var(--bad); }
  #status { margin-left: auto; font-size: 12px; color: var(--dim); }
  #status.connected { color: var(--good); }
  #status.error { color: var(--bad); }

  main { position: relative; display: grid; grid-template-columns: 1fr; min-height: 0; }
  main.history-open { grid-template-columns: 1fr 320px; }

  #chart-pane { position: relative; min-width: 0; min-height: 0; }
  #g { width: 100%; height: 100%; }

  #overlay {
    position: absolute; top: 56px; left: 24px; pointer-events: none;
    display: flex; flex-direction: column; gap: 4px;
    text-shadow: 0 0 10px rgba(0,0,0,0.8);
  }
  #weight { font-size: 64px; font-weight: 200; line-height: 1; font-variant-numeric: tabular-nums; }
  #weight .unit { font-size: 24px; color: var(--dim); margin-left: 4px; }
  #elapsed { font-size: 18px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #flow { font-size: 14px; color: var(--accent2); font-variant-numeric: tabular-nums; margin-top: 2px; }
  #endsummary {
    margin-top: 8px; font-size: 13px; color: var(--dim); max-width: 360px; line-height: 1.5;
  }

  #widgets {
    position: absolute; top: 16px; right: 24px; pointer-events: none;
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    text-shadow: 0 0 10px rgba(0,0,0,0.8);
  }
  .widget { font-size: 13px; color: var(--dim); }
  .widget .v { color: var(--fg); font-variant-numeric: tabular-nums; }

  #history {
    border-left: 1px solid var(--border); background: var(--panel);
    overflow-y: auto; display: none;
  }
  main.history-open #history { display: block; }
  #history-header {
    padding: 10px 14px; font-size: 12px; color: var(--dim);
    text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  #history-header button {
    background: none; border: 1px solid var(--border); color: var(--dim);
    font: inherit; font-size: 11px; padding: 2px 8px; border-radius: 3px; cursor: pointer;
  }
  .row {
    padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer;
    display: grid; grid-template-columns: 1fr auto; gap: 2px 10px;
    font-size: 13px;
  }
  .row:hover { background: #222; }
  .row.selected { background: #1f2a35; }
  .row .when { color: var(--dim); font-size: 11px; grid-column: 1 / -1; }
  .row .stats { color: var(--dim); font-size: 11px; }
  .row .weight-val { color: var(--accent); font-variant-numeric: tabular-nums; }
  #history-empty { padding: 20px; color: var(--dim); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Espresso shot</h1>
  <div class="tabs">
    <button class="tab active" data-mode="live">Live</button>
    <button class="tab" data-mode="history">History</button>
  </div>
  <span class="badge idle" id="state-badge">IDLE</span>
  <span class="badge offline" id="device-badge" style="display:none">DEVICE OFFLINE</span>
  <span id="status">connecting…</span>
</header>
<main id="main">
  <div id="chart-pane">
    <div id="g"></div>
    <div id="overlay">
      <div id="weight" style="display:none"><span class="v">0.0</span><span class="unit">g</span></div>
      <div id="elapsed" style="display:none">0.0 s</div>
      <div id="flow" style="display:none">0.0 g/s</div>
      <div id="endsummary" style="display:none"></div>
    </div>
    <div id="widgets">
      <div class="widget">tank <span class="v" id="tank-v">—</span>%</div>
    </div>
  </div>
  <aside id="history">
    <div id="history-header">
      <span>Recent shots</span>
      <button id="back-to-live">Back to live</button>
    </div>
    <div id="history-list"></div>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
const statusEl = $('status');
const stateBadge = $('state-badge');
const deviceBadge = $('device-badge');
const tankV = $('tank-v');
const weightEl = $('weight');
const weightV = weightEl.querySelector('.v');
const elapsedEl = $('elapsed');
const flowEl = $('flow');
const endSummaryEl = $('endsummary');
const mainEl = $('main');
const historyList = $('history-list');

// "live" — drawing live samples; "replay" — pinned to a historic shot
let mode = 'live';
let activeShotId = null;
let selectedFile = null;

const layout = {
  paper_bgcolor: '#111',
  plot_bgcolor: '#111',
  font: { color: '#ccc' },
  margin: { l: 50, r: 60, t: 20, b: 40 },
  xaxis: { title: 'Seconds since pump-on', gridcolor: '#222', zerolinecolor: '#333' },
  yaxis: { title: 'Weight (g)', gridcolor: '#222', zerolinecolor: '#333' },
  yaxis2: { title: 'Flow (g/s)', overlaying: 'y', side: 'right', gridcolor: '#222' },
  showlegend: true,
  legend: { x: 0, y: 1.05, orientation: 'h' },
};

Plotly.newPlot('g', [
  { x: [], y: [], name: 'Weight (g)', mode: 'lines', line: { color: '#6cf', width: 2 } },
  { x: [], y: [], name: 'Flow (g/s)', yaxis: 'y2', mode: 'lines', line: { color: '#fc6', width: 2 } },
], layout, { responsive: true, displayModeBar: false });

window.addEventListener('resize', () => Plotly.Plots.resize('g'));

function setBadge(text, cls) {
  stateBadge.textContent = text;
  stateBadge.className = `badge ${cls}`;
}

function clearChart() {
  Plotly.restyle('g', { x: [[], []], y: [[], []] }, [0, 1]);
}

function showOverlay({ weight, elapsed, flow }) {
  weightEl.style.display = '';
  elapsedEl.style.display = '';
  flowEl.style.display = '';
  weightV.textContent = (weight ?? 0).toFixed(1);
  elapsedEl.textContent = `${(elapsed ?? 0).toFixed(1)} s`;
  flowEl.textContent = `${(flow ?? 0).toFixed(2)} g/s`;
}

function hideOverlay() {
  weightEl.style.display = 'none';
  elapsedEl.style.display = 'none';
  flowEl.style.display = 'none';
}

function showEndSummary(p) {
  endSummaryEl.style.display = '';
  const parts = [
    p.final_weight_g != null ? `${p.final_weight_g}g` : null,
    p.duration_s != null ? `in ${p.duration_s}s` : null,
    p.preinfusion_s != null ? `(preinfusion ${p.preinfusion_s}s)` : null,
    p.peak_flow_g_s != null ? `peak ${p.peak_flow_g_s} g/s` : null,
  ].filter(Boolean);
  endSummaryEl.textContent = parts.join(' · ');
}

function hideEndSummary() {
  endSummaryEl.style.display = 'none';
  endSummaryEl.textContent = '';
}

// --- MQTT ---
const wsUrl = `ws://${window.location.hostname}:9001`;
const client = mqtt.connect(wsUrl, {
  clientId: 'web-' + Math.random().toString(16).slice(2, 10),
  reconnectPeriod: 2000,
});

client.on('connect', () => {
  statusEl.textContent = `connected ${wsUrl}`;
  statusEl.className = 'connected';
  client.subscribe([
    'coffee/shot/start', 'coffee/shot/sample', 'coffee/shot/end',
    'coffee/water/pct', 'coffee/device/state',
  ]);
});
client.on('error', (err) => { statusEl.textContent = `error: ${err.message}`; statusEl.className = 'error'; });
client.on('reconnect', () => { statusEl.textContent = 'reconnecting…'; statusEl.className = ''; });

client.on('message', (topic, msg) => {
  const text = msg.toString();
  let p;
  try { p = JSON.parse(text); } catch { p = text; }

  if (topic === 'coffee/water/pct') {
    const n = parseFloat(text);
    tankV.textContent = Number.isFinite(n) ? Math.round(n) : '—';
    return;
  }
  if (topic === 'coffee/device/state') {
    deviceBadge.style.display = (text === 'online') ? 'none' : '';
    return;
  }

  // Shot topics — ignore live data while pinned to a historic shot
  if (mode === 'replay') return;

  if (topic === 'coffee/shot/start') {
    activeShotId = p.shot_id;
    clearChart();
    hideEndSummary();
    showOverlay({ weight: 0, elapsed: 0, flow: 0 });
    setBadge('EXTRACTING', 'extracting');
    if (p.tank_pct_at_start != null) tankV.textContent = Math.round(p.tank_pct_at_start);
  } else if (topic === 'coffee/shot/sample') {
    if (activeShotId == null) {
      activeShotId = p.shot_id;
      setBadge('EXTRACTING', 'extracting');
    }
    const t = (p.t_ms ?? 0) / 1000;
    Plotly.extendTraces('g', { x: [[t], [t]], y: [[p.weight_g], [p.flow_g_s]] }, [0, 1]);
    showOverlay({ weight: p.weight_g, elapsed: t, flow: p.flow_g_s });
  } else if (topic === 'coffee/shot/end') {
    activeShotId = null;
    setBadge('DONE', 'done');
    showEndSummary(p);
    if (p.final_weight_g != null) weightV.textContent = p.final_weight_g.toFixed(1);
    if (p.duration_s != null) elapsedEl.textContent = `${p.duration_s.toFixed(1)} s`;
    flowEl.style.display = 'none';
    // Refresh the history list so the new shot shows up
    loadHistory();
  }
});

// --- History tab + replay ---
async function loadHistory() {
  try {
    const r = await fetch('/shots/index.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const items = await r.json();
    renderHistory(items);
  } catch (e) {
    historyList.innerHTML = `<div id="history-empty">No history yet (${e.message})</div>`;
  }
}

function renderHistory(items) {
  if (!items.length) {
    historyList.innerHTML = `<div id="history-empty">No shots saved yet.</div>`;
    return;
  }
  historyList.innerHTML = items.map(it => {
    const when = it.saved_at || it.file;
    const dur = it.duration_s != null ? `${it.duration_s.toFixed(1)}s` : '—';
    const wt = it.final_weight_g != null ? `${it.final_weight_g.toFixed(1)}g` : '—';
    const flow = it.peak_flow_g_s != null ? `${it.peak_flow_g_s.toFixed(2)} g/s peak` : '';
    const tank = it.tank_pct_at_start != null ? `tank ${Math.round(it.tank_pct_at_start)}%` : '';
    const meta = [flow, tank].filter(Boolean).join(' · ');
    const sel = it.file === selectedFile ? ' selected' : '';
    return `
      <div class="row${sel}" data-file="${it.file}">
        <span class="when">${when}</span>
        <span><span class="weight-val">${wt}</span> <span class="stats">in ${dur}</span></span>
        <span class="stats">${meta}</span>
      </div>`;
  }).join('');
  historyList.querySelectorAll('.row').forEach(r => {
    r.addEventListener('click', () => replayShot(r.dataset.file));
  });
}

async function replayShot(file) {
  try {
    const r = await fetch(`/shots/${encodeURIComponent(file)}`, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const shot = await r.json();
    selectedFile = file;
    mode = 'replay';
    setBadge('REPLAY', 'replay');
    clearChart();

    const samples = shot.samples || [];
    const xs = samples.map(s => (s.t_ms ?? 0) / 1000);
    Plotly.restyle('g', {
      x: [xs, xs],
      y: [samples.map(s => s.weight_g), samples.map(s => s.flow_g_s)],
    }, [0, 1]);

    weightEl.style.display = '';
    elapsedEl.style.display = '';
    flowEl.style.display = 'none';
    weightV.textContent = (shot.final_weight_g ?? 0).toFixed(1);
    elapsedEl.textContent = `${(shot.duration_s ?? 0).toFixed(1)} s`;
    showEndSummary(shot);
    if (shot.tank_pct_at_start != null) tankV.textContent = Math.round(shot.tank_pct_at_start);
    // re-render history for the .selected highlight
    loadHistory();
  } catch (e) {
    statusEl.textContent = `replay failed: ${e.message}`;
    statusEl.className = 'error';
  }
}

function backToLive() {
  mode = 'live';
  selectedFile = null;
  activeShotId = null;
  clearChart();
  hideOverlay();
  hideEndSummary();
  setBadge('IDLE', 'idle');
  loadHistory();
}

// --- Tab switching ---
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    if (t.dataset.mode === 'history') {
      mainEl.classList.add('history-open');
      loadHistory();
    } else {
      mainEl.classList.remove('history-open');
      if (mode === 'replay') backToLive();
    }
  });
});
$('back-to-live').addEventListener('click', backToLive);

// Initial fetch (so the count is fresh in case the user toggles to history)
loadHistory();
</script>
</body>
</html>
