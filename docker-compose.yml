services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT (firmware + tools)
      - "9001:9001"   # MQTT-over-WebSockets (browser)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data

  shot-logger:
    build: ./logger
    container_name: shot-logger
    restart: unless-stopped
    volumes:
      - ./shots:/data/shots
    depends_on:
      - mosquitto

  # ESPHome Native API subscriber — alternative to the MQTT logger.
  # Runs in parallel during the transition; reads sensor state directly
  # from the device, no broker hop.
  native-subscriber:
    build: ./native-subscriber
    container_name: native-subscriber
    restart: unless-stopped
    environment:
      DEVICE_HOST: "${DEVICE_HOST:-192.168.2.29}"
      DEVICE_PORT: "${DEVICE_PORT:-6053}"
      DEVICE_HTTP_PORT: "${DEVICE_HTTP_PORT:-8080}"
      DEVICE_PASSWORD: "${DEVICE_PASSWORD:-}"
      DEVICE_NOISE_PSK: "${DEVICE_NOISE_PSK:-}"
      DEVICE_NAME: "${DEVICE_NAME:-coffee-pro}"
    volumes:
      - ./shots:/data/shots

  web:
    image: caddy:2-alpine
    container_name: coffee-web
    restart: unless-stopped
    ports:
      - "8418:80"
    volumes:
      - ./web:/usr/share/caddy
      - ./web/Caddyfile:/etc/caddy/Caddyfile
      - ./shots:/usr/share/caddy/shots:ro
    depends_on:
      - mosquitto
