services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT (firmware + tools)
      - "9001:9001"   # MQTT-over-WebSockets (browser)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data

  shot-logger:
    build: ./logger
    container_name: shot-logger
    restart: unless-stopped
    volumes:
      - ./shots:/data/shots
    depends_on:
      - mosquitto

  web:
    image: caddy:2-alpine
    container_name: coffee-web
    restart: unless-stopped
    ports:
      - "8418:80"
    volumes:
      - ./web:/usr/share/caddy
      - ./web/Caddyfile:/etc/caddy/Caddyfile
      - ./shots:/usr/share/caddy/shots:ro
    depends_on:
      - mosquitto
